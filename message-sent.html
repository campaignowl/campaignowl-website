<!DOCTYPE html>
<html lang="en">
<head>
<!-- Google tag with Consent Mode v2 — consent starts DENIED (cookieless
     pings only); cookie-consent.js upgrades it on Accept. Both destinations
     configured: GA4 for analytics, Google Ads (AW-) so ad landing pages
     aren't flagged "missing a Google tag". -->
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){ dataLayer.push(arguments); }
  window.gtag = gtag;
  gtag('consent', 'default', {
    ad_storage: 'denied',
    ad_user_data: 'denied',
    ad_personalization: 'denied',
    analytics_storage: 'denied'
  });
  gtag('set', 'url_passthrough', true);
  gtag('js', new Date());
  gtag('config', 'G-LWRQTR3Q8H', {
    linker: { domains: ['campaignowl.co.uk', 'app.campaignowl.com'] }
  });
  gtag('config', 'AW-18263347504', {
    linker: { domains: ['campaignowl.co.uk', 'app.campaignowl.com'] }
  });
</script>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-LWRQTR3Q8H"></script>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Message sent — Campaign Owl</title>
<meta name="description" content="The exact 60-point Google Ads audit checklist built from 18 years of hands-on PPC management — tracking, search terms, budgets, bidding, ads and Quality Score. Free, with a short email course on using it.">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="icon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#fffdf8;--surface:#faf7f0;--border:#eee5d6;--text:#5c5344;--bright:#1f1a12;--amber:#b45309}
body{background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;line-height:1.7;-webkit-font-smoothing:antialiased}
a{color:var(--amber);text-decoration:none}
a:hover{text-decoration:underline}
.container{max-width:680px;margin:0 auto;padding:0 24px}
nav{padding:16px 0;border-bottom:1px solid var(--border)}
nav .container{display:flex;align-items:center;gap:10px}
.nav-logo-icon{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#f59e0b,#d97706);display:flex;align-items:center;justify-content:center;font-size:18px}
.nav-logo-text{font-weight:700;font-size:15px;color:var(--bright)}
.hero{padding:64px 0 24px;text-align:center}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:2px;text-transform:uppercase;color:var(--amber);margin-bottom:14px}
h1{font-size:34px;font-weight:700;color:var(--bright);line-height:1.25;margin-bottom:16px;letter-spacing:-0.01em}
.sub{font-size:16px;max-width:540px;margin:0 auto 8px}
.points{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin:28px 0 0}
.point{border:1px solid var(--border);background:var(--surface);border-radius:99px;padding:7px 14px;font-size:13px;color:var(--text)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:32px;margin:40px auto 24px;max-width:480px;text-align:left}
.card h2{font-size:17px;font-weight:700;color:var(--bright);margin-bottom:6px}
.card .hint{font-size:13px;color:#777;margin-bottom:20px}
label{display:block;font-size:13px;font-weight:600;color:var(--bright);margin:0 0 6px}
input[type=text],input[type=email]{width:100%;background:#080808;border:1px solid #222;border-radius:10px;padding:12px 14px;font-size:14px;color:var(--bright);font-family:inherit;margin-bottom:16px}
input:focus{outline:none;border-color:var(--amber)}
button{width:100%;background:linear-gradient(135deg,#f59e0b,#d97706);border:none;border-radius:10px;padding:14px;font-size:15px;font-weight:700;color:#fff;cursor:pointer;font-family:inherit}
button:hover{filter:brightness(1.08)}
button:disabled{opacity:.6;cursor:default}
.consent{font-size:12px;color:#777;line-height:1.6;margin-top:14px}
.success{display:none;text-align:center;padding:12px 0}
.success h2{font-size:20px;color:var(--bright);margin-bottom:8px}
.success p{font-size:14px}
.err{display:none;color:#f87171;font-size:13px;margin-top:12px;text-align:center}
.trust{font-size:12px;color:#555;text-align:center;margin-bottom:64px}
footer{border-top:1px solid var(--border);padding:24px 0;text-align:center}
footer p{font-size:12px;color:#444}
.grecaptcha-badge{visibility:hidden !important}
.recaptcha-note{font-size:11px;color:#444;text-align:center;margin-top:10px}
.recaptcha-note a{color:#666}
@media (max-width:600px){h1{font-size:26px}.card{padding:24px}}
</style>

<meta name="robots" content="noindex">
</head>
<body>
<div class="wrap">
  <div class="card">
    <div class="success" style="display:block">
      <h1>Thanks — message received</h1>
      <p>I read every message myself and will get back to you shortly — usually the same working day.</p>
      <p style="margin-top:24px"><a href="https://app.campaignowl.com/signup">Start a free trial</a> in the meantime — 14 days, and you can see what Campaign Owl finds in your accounts before we speak.</p>
      <p style="margin-top:16px"><a href="/">Back to campaignowl.co.uk</a></p>
    </div>
  </div>
</div>
</body>
</html>
